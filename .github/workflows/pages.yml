name: pages

# Builds the web page from rules/, src/ and web/ and publishes it on GitHub
# Pages. The page is never committed: it is regenerated here on every push, so
# it cannot drift from the rules. Pyodide and pypdf are downloaded, checked
# against pinned SHA-256 hashes and served from the same address as the page.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Check dist/ matches the rules
        run: python tools/build.py --check
      - name: Build the site
        run: python tools/build.py --site site --vendor
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
